name: Publish
# Manual only. Publishing to Maven Central is not enabled yet: this builds the artifacts and installs them in the
# runner's local repository, without any registry credential.
on:
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Install locally (no publication)
        run: mvn -B install
